packages:
  - playground

overrides:
  "@nuxt/schema": "4.7.0"
  "@nuxtjs/critters": "workspace:*"

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - beasties@0.5.0 || 0.5.2
  - "@nuxt/kit@4.7.0"
  - "@nuxt/nitro-server@4.7.0"
  - "@nuxt/nitro-v3-server@4.7.0"
  - "@nuxt/schema@4.7.0"
  - "@nuxt/vite-builder@4.7.0"
  - "@nuxt/vite-server@4.7.0"
  - nitropack@2.14.0
  - nuxt@4.7.0
